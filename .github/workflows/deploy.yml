name: Deploy to Jelastic

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH to Jelastic
        uses: appleboy/ssh-action@v1.0.3
        with:
          command_timeout: 30m 
          host: ${{ secrets.JELASTIC_HOST }}
          username: ${{ secrets.JELASTIC_USER }}
          key: ${{ secrets.JELASTIC_SSH_KEY }}
          port: ${{ secrets.JELASTIC_PORT }}
          script: |
            set -euo pipefail
            cd /opt/bl-app
            # git pull can fail silently when server-only untracked files block the merge
            # (e.g. scripts/run-engagement-cron.sh). Force-sync to GitHub main instead.
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying commit: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
            # Legge una variabile dal .env senza interpretarne il valore.
            # `. ./.env` non va usato: fallisce con errore di sintassi su ogni
            # valore che contenga spazi o metacaratteri di shell, e RESEND_FROM_EMAIL
            # ne contiene ("Biography Library <noreply@...>"). Con set -e il deploy
            # muore prima ancora di costruire l'immagine.
            env_value() { sed -n "s/^$1=//p" .env | head -1; }
            docker build -t biography-library \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="$(env_value NEXT_PUBLIC_SUPABASE_URL)" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$(env_value NEXT_PUBLIC_SUPABASE_ANON_KEY)" \
              --build-arg NEXT_PUBLIC_APP_URL="$(env_value NEXT_PUBLIC_APP_URL)" \
              --build-arg NEXT_PUBLIC_SITE_NAME="$(env_value NEXT_PUBLIC_SITE_NAME)" \
              --build-arg NEXT_PUBLIC_SITE_URL="$(env_value NEXT_PUBLIC_SITE_URL)" \
              .
            docker stop bl-app || true
            docker rm bl-app || true
            docker run -d \
              --name bl-app \
              --restart unless-stopped \
              -p 80:3000 \
              --env-file .env \
              biography-library
            docker image prune -af --filter "until=24h"
            docker builder prune -af --filter "until=24h"
            echo "Deploy completato: $(date)"
            docker system df
