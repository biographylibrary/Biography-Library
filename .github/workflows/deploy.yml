name: Deploy to Jelastic

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH to Jelastic
        uses: appleboy/ssh-action@v1.0.3
        with:
          command_timeout: 30m 
          host: ${{ secrets.JELASTIC_HOST }}
          username: ${{ secrets.JELASTIC_USER }}
          key: ${{ secrets.JELASTIC_SSH_KEY }}
          port: ${{ secrets.JELASTIC_PORT }}
          script: |
            set -euo pipefail
            cd /opt/bl-app
            # git pull can fail silently when server-only untracked files block the merge
            # (e.g. scripts/run-engagement-cron.sh). Force-sync to GitHub main instead.
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying commit: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
            set -a
            # shellcheck source=/dev/null
            . ./.env
            set +a
            docker build -t biography-library \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
              --build-arg NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL}" \
              --build-arg NEXT_PUBLIC_APP_ENV="${NEXT_PUBLIC_APP_ENV:-production}" \
              --build-arg NEXT_PUBLIC_SITE_NAME="${NEXT_PUBLIC_SITE_NAME:-Biography Library}" \
              .
            docker stop bl-app || true
            docker rm bl-app || true
            docker run -d \
              --name bl-app \
              --restart unless-stopped \
              -p 80:80 \
              --env-file .env \
              biography-library
            docker image prune -af --filter "until=24h"
            docker builder prune -af --filter "until=24h"
            echo "Deploy completato: $(date)"
            docker system df
